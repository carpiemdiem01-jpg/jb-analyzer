<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>JB Analyzer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #eaeaea;
    }

    h1, h2, h3 {
      margin: 8px 0;
    }

    .box {
      background: #1b1b1b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input[type="date"],
    select,
    textarea,
    button {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      background: #2b8cff;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
    }

    button:hover {
      opacity: 0.9;
    }

    .checks {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .checks label {
      font-weight: normal;
    }

    .analysis-block {
      margin-bottom: 12px;
      padding: 10px;
      border-left: 4px solid #2b8cff;
      background: #1c1c1c;
      border-radius: 4px;
    }

    .small {
      font-size: 14px;
      opacity: 0.75;
    }
  </style>
</head>

<body>

  <h1>📊 JB Analyzer</h1>

  <!-- FILTROS -->
  <div class="box">
    <label>Data final</label>
    <input type="date" id="date">

    <label>Intervalo (dias)</label>
    <select id="days">
      <option value="1">1 dia</option>
      <option value="2">2 dias</option>
      <option value="3">3 dias</option>
      <option value="5" selected>5 dias</option>
      <option value="7">7 dias</option>
      <option value="10">10 dias</option>
    </select>

    <label>Loterias</label>
    <div class="checks">
      <label><input type="checkbox" id="lot_LOOK" checked> LOOK</label>
      <label><input type="checkbox" id="lot_RJ" checked> RJ</label>
      <label><input type="checkbox" id="lot_SP" checked> SP</label>
      <label><input type="checkbox" id="lot_NACIONAL" checked> NACIONAL</label>
    </div>

    <button onclick="loadData()">Buscar resultados</button>
  </div>

  <!-- ENTRADA MANUAL -->
  <div class="box">
    <h3>✍️ Inserir resultado manual</h3>

    <label>Nome da loteria</label>
    <input type="text" id="manual_name" placeholder="Ex: BANCA X 18h">

    <label>Data</label>
    <input type="date" id="manual_date">

    <label>Resultados (1º ao 5º prêmio)</label>
    <textarea id="manual_numbers"
      placeholder="Ex: 1234, 5678, 9012, 3456, 7890"></textarea>

    <button onclick="addManualResult()">Adicionar análise</button>
  </div>

  <!-- ANÁLISES -->
  <div class="box">
    <h2>🧠 Análises</h2>
    <div id="analysis">
      <div class="analysis-block">Aguardando dados...</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
