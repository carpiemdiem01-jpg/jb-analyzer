<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JB Analyzer</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      margin: 0;
      padding: 12px;
    }
    h2, h3 {
      margin: 6px 0;
    }
    label {
      font-size: 14px;
      opacity: 0.8;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #1e88e5;
      border: none;
      color: #fff;
      font-size: 16px;
      border-radius: 8px;
    }
    select, input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    pre {
      background: #1b1b1b;
      padding: 12px;
      border-radius: 8px;
      white-space: pre-wrap;
    }
    .box {
      margin-top: 14px;
    }
  </style>
</head>
<div class="box">
  <h3>⚙️ Editor de Regras</h3>
  <textarea id="rules" rows="6"></textarea>
  <button onclick="saveRules()">Salvar regras</button>
</div>
<body>

<h2>📊 JB Analyzer</h2>

<label>Estado</label>
<select id="state">
  <option value="GO">GO</option>
  <option value="RJ">RJ</option>
  <option value="SP">SP</option>
  <option value="NACIONAL">NACIONAL</option>
</select>

<label>Data final</label>
<input type="date" id="date">

<label>Intervalo (dias)</label>
<select id="days">
  <option value="1">1 dia</option>
  <option value="2">2 dias</option>
  <option value="3">3 dias</option>
  <option value="5" selected>5 dias</option>
  <option value="7">7 dias</option>
  <option value="10">10 dias</option>
</select>

<button onclick="loadData()">Buscar resultados</button>

<div class="box">
  <h3>📋 Resultados</h3>
  <pre id="results">Aguardando busca...</pre>
</div>

<div class="box">
  <h3>🧠 Análises</h3>
  <pre id="analysis">—</pre>
</div>

<script src="app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>

</body>
</html>
