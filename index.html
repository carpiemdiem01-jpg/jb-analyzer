<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>JB Analyzer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="manifest.json" />

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #121212;
      color: #eee;
    }

    header {
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      background: #0d0d0d;
      border-bottom: 1px solid #222;
    }

    section {
      padding: 16px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
    }

    button {
      background: #2b8cff;
      color: #fff;
      cursor: pointer;
      margin-top: 16px;
      font-weight: bold;
    }

    button:hover {
      background: #1f6fd6;
    }

    .box {
      background: #1a1a1a;
      padding: 14px;
      border-radius: 8px;
      margin-top: 16px;
    }

    .analysis-block {
      border-left: 4px solid #2b8cff;
      padding: 10px 12px;
      margin-bottom: 12px;
      background: #1e1e1e;
      border-radius: 6px;
    }

    .analysis-title {
      font-weight: bold;
      margin-bottom: 6px;
      color: #4fc3f7;
    }

    .small {
      font-size: 13px;
      opacity: 0.85;
    }
  </style>
</head>
<body>

<header>📊 JB Analyzer</header>

<section>
  <label>Estado</label>
  <select id="state">
    <option value="GO">GO</option>
    <option value="RJ">RJ</option>
    <option value="SP">SP</option>
    <option value="NACIONAL">NACIONAL</option>
  </select>

  <label>Data final</label>
  <input type="date" id="date" />

  <label>Intervalo (dias)</label>
  <input type="number" id="days" value="2" min="1" max="15" />

  <button onclick="loadData()">Buscar resultados</button>

  <div class="box">
    <h3>📋 Resultados</h3>
    <div id="results" class="small">Aguardando...</div>
  </div>

  <div class="box">
    <h3>🧠 Análises por Sorteio</h3>
    <div id="analysis">—</div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
